<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Country Facts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Random Country Facts</h1>
            <p class="subtitle">Click the button to discover interesting facts about countries around the world</p>
        </header>

        <main>
            <div class="card-container">
                <div class="country-card" id="countryCard">
                    <div class="card-content" id="cardContent">
                        <div class="loading">Loading...</div>
                    </div>
                </div>

                <button id="factButton" class="btn btn-primary">Get Random Fact</button>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Country Facts Explorer. Learn about the world!</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
